  <text x="130" y="440" fill="#64748b" font-size="12" font-family="Inter, Arial, sans-serif">Low proactivity</text>
  <text x="125" y="472" fill="#64748b" font-size="12" font-family="Inter, Arial, sans-serif">Low context</text>
  <text x="815" y="472" text-anchor="end" fill="#64748b" font-size="12" font-family="Inter, Arial, sans-serif">High context</text>
