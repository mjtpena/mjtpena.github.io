<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title>Figure 3 — Context Richness vs. Proactivity Landscape</title>
  <desc>Transition Intelligence Agent (TIA) occupies the proactive + context-rich quadrant</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="960" height="560" fill="url(#bg)" rx="16"/>
  <text x="40" y="42" fill="#f8fafc" font-size="24" font-family="Inter, Arial, sans-serif" font-weight="700">Figure 3 — Context Richness vs. Proactivity Landscape</text>
  <text x="40" y="68" fill="#94a3b8" font-size="14" font-family="Inter, Arial, sans-serif">Transition Intelligence Agent (TIA) occupies the proactive + context-rich quadrant</text>
  <rect x="120" y="120" width="700" height="330" fill="#0b1220" stroke="#334155" rx="10"/>
  <line x1="470.0" y1="120" x2="470.0" y2="450" stroke="#334155"/>
  <line x1="120" y1="285.0" x2="820" y2="285.0" stroke="#334155"/>
