<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title>Figure 2 — Closed Transition Loop</title>
  <desc>Four steps: detect, brief, capture, update. Each interaction updates memory, which shapes the next brief.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="960" height="560" fill="url(#bg)" rx="16"/>
  <text x="40" y="42" fill="#f8fafc" font-size="24" font-family="Inter, Arial, sans-serif" font-weight="700">Figure 2 — Closed Transition Loop</text>
  <text x="40" y="68" fill="#94a3b8" font-size="14" font-family="Inter, Arial, sans-serif">Each interaction updates memory, and memory shapes the next brief</text>
  <rect x="290" y="130" width="380" height="56" rx="10" fill="#0b1220" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="480" y="163" text-anchor="middle" fill="#e2e8f0" font-size="15" font-family="Inter, Arial, sans-serif">1) Detect: upcoming interaction on the calendar</text>
  <rect x="290" y="230" width="380" height="56" rx="10" fill="#0b1220" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="480" y="263" text-anchor="middle" fill="#e2e8f0" font-size="15" font-family="Inter, Arial, sans-serif">2) Brief: live context, open commitments first</text>
  <rect x="290" y="330" width="380" height="56" rx="10" fill="#0b1220" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="480" y="363" text-anchor="middle" fill="#e2e8f0" font-size="15" font-family="Inter, Arial, sans-serif">3) Capture: decisions and commitments at the end</text>
  <rect x="290" y="430" width="380" height="56" rx="10" fill="#0b1220" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="480" y="463" text-anchor="middle" fill="#e2e8f0" font-size="15" font-family="Inter, Arial, sans-serif">4) Update: relationship memory for next time</text>
  <line x1="480" y1="186" x2="480" y2="224" stroke="#f97316" stroke-width="2.5"/>
  <polygon points="480,230 474,220 486,220" fill="#f97316"/>
  <line x1="480" y1="286" x2="480" y2="324" stroke="#f97316" stroke-width="2.5"/>
  <polygon points="480,330 474,320 486,320" fill="#f97316"/>
  <line x1="480" y1="386" x2="480" y2="424" stroke="#f97316" stroke-width="2.5"/>
  <polygon points="480,430 474,420 486,420" fill="#f97316"/>
  <path d="M 670 458 C 820 458, 860 160, 682 158" fill="none" stroke="#f97316" stroke-width="2.5" stroke-dasharray="8 6"/>
  <polygon points="672,158 684,152 684,164" fill="#f97316"/>
  <text x="818" y="312" fill="#fbbf24" font-size="13" font-family="Inter, Arial, sans-serif">Feedback loop</text>
</svg>
